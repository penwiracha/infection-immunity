<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taxonomy Browse</title>
<script src="../app/theme.js"></script>
<script src="../app/i18n-th.js"></script>
<script src="../app/i18n.js"></script>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2b303b;--txt:#e6e8ec;--dim:#9aa3b2;
 --extra:#e0603f;--vesic:#e0a83f;--cyto:#4fa3e3;--surf:#57b86b;--host:#7a6cf0;--on-c:#0f1115;}
html[data-theme="light"]{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --line:#dde1e7;
  --txt:#16181d; --ink:#16181d; --dim:#5f6878; --dim2:#6b7280;
  --extra:#b5401c; --vesic:#8f5b00; --cyto:#1f6fb5; --surf:#26773d; --host:#6a58e0;
  --on-c:#ffffff; --t1bg:#dcefe1; --t1:#22693a; --t2bg:#f3e6c8; --t2:#7a5200; --failbg:#fbe1ee; --fail:#a3245f;
}
html[data-theme="light"] .chip.on small,html[data-theme="light"] .king.on small,html[data-theme="light"] .fam.on small{color:rgba(255,255,255,.9)}
html[data-theme="light"] .lcpic{border:1px solid var(--line)}
html[data-theme="light"] #pop-backdrop{background:rgba(20,24,33,.38)}
html[data-theme="light"] .side{box-shadow:0 28px 80px rgba(20,24,33,.22)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
 font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:22px 28px 14px;border-bottom:1px solid var(--line)}
h1{margin:0 0 6px;font-size:22px}
.sub{color:var(--dim);font-size:13.5px;max-width:900px}
.sub a{color:var(--dim)}
.kings{display:flex;gap:8px;flex-wrap:wrap;padding:12px 28px;border-bottom:1px solid var(--line)}
.king{padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);
 font-weight:600;font-size:13px;cursor:pointer;user-select:none}
.king small{color:var(--dim);font-weight:400;margin-left:6px}
.king.on{background:var(--c);color:var(--on-c);border-color:var(--c)}
.king.on small{color:rgba(0,0,0,.55)}
.king.seam{opacity:.5}
.wrap{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,440px)}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.tree{padding:16px 28px 60px}
.side{position:sticky;top:0;max-height:100vh;overflow:auto;background:var(--panel);
 border-left:1px solid var(--line);padding:22px 24px 60px}
.src{font-size:11.5px;color:var(--dim);margin:0 0 12px}
/* ---- top-down identification chart ---- */
.tree{min-width:0}
.chart-scroll{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:4px 2px 12px;-webkit-overflow-scrolling:touch}
.chart-scroll.pannable{cursor:grab}
.chart-scroll.panning{cursor:grabbing;user-select:none}
.chart{position:relative;margin:0 auto}
.chart svg.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.chart svg.edges path{fill:none;stroke:var(--dim);stroke-opacity:.5;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.tbox{position:absolute;left:0;top:0;width:var(--bw,184px)}
.tnode{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.35}
.tnode .tl{font-weight:600}
.tnode .tn{font-size:11px;color:var(--dim);margin-top:3px}
.tnode .tt{margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);font-size:11px;color:var(--dim);font-style:italic;line-height:1.35}
.tnode .tt::before{content:"↓ ";font-style:normal}
.tnode.troot{border-color:var(--k);box-shadow:inset 4px 0 0 var(--k);font-size:14px;padding-left:14px}
.tstack{border:1px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px}
.leaf{display:block;width:100%;text-align:left;font:inherit;font-size:12.5px;line-height:1.35;color:var(--txt);
 padding:6px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--surf);
 cursor:pointer;transition:transform .12s,border-color .12s}
.leaf:hover{transform:translateY(-1px);border-color:var(--dim);border-left-color:var(--surf)}
.leaf:focus-visible{outline:2px solid var(--surf);outline-offset:2px}
.leaf.active{background:var(--surf);color:var(--on-c);border-color:var(--surf);font-weight:600}
.leaf b{font-weight:600;display:block}
.leaf .ll{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:1px}
.leaf.active .ll{color:inherit;opacity:.85}
.chart-hint{font-size:11.5px;color:var(--dim);margin:-4px 0 10px;display:none}
.chart-hint.on{display:block}
@media (prefers-reduced-motion:reduce){.leaf{transition:none}}
.pending{color:var(--dim);font-size:13.5px;max-width:640px;line-height:1.7;
 border-left:3px solid var(--line);padding-left:16px}
.empty{color:var(--dim);font-size:13.5px;text-align:center;padding-top:44px;line-height:1.7}
/* detail panel */
.card h2{margin:0 0 3px;font-size:19px}
.card .kick{font-size:11.5px;color:var(--dim);margin-bottom:12px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.badges span{font-size:10.5px;padding:3px 8px;border-radius:5px;background:var(--panel2);color:var(--dim)}
.badges .n{color:var(--on-c);font-weight:600}
.scope{font-size:11px;color:var(--dim);margin:-6px 0 14px}
.scope b{color:var(--txt)}
.micro{margin:0 0 10px}
.microcap{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
.microcap code{background:var(--panel2);padding:1px 5px;border-radius:4px}
.lookhint{display:flex;gap:8px;align-items:flex-start;margin:0 0 14px;padding:9px 11px;
  background:var(--panel2);border-radius:8px;border-left:3px solid var(--k,var(--surf))}
.lookhint .em{font-size:15px;line-height:1.2}
.lookhint .lbl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:1px}
.lookhint b{color:var(--txt);font-size:13px;line-height:1.35}
.blk{margin-bottom:11px;padding:11px 13px;background:var(--panel2);border-radius:8px;border-left:3px solid var(--k,var(--surf))}
.blk .lab{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.blk p{margin:0;font-size:13px}
.tax{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px}
.tax dt{color:var(--dim)}
.tax dd{margin:0}
.rx{margin:6px 0 0;padding:0;list-style:none}
.rx li{margin-bottom:7px;font-size:12.5px}
.rx b{color:var(--txt)}
.rx span{color:var(--dim)}
.awaiting{font-size:12px;color:var(--dim);font-style:italic}
.routes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.rtag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--txt);
 background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 9px 3px 7px}
.rtag .e{font-size:14px;line-height:1}
.lcimg{margin-bottom:6px}
.lcpic{width:100%;border-radius:8px;display:block;background:#fff}
</style>
</head>
<body>
<!-- online-only -->
<script src="../app/sitenav.js"></script>
<script>SiteNav.mount({ active: "taxonomy" });</script>
<!-- /online-only -->
<header>
  <h1>Taxonomy browse — identification key</h1>
  <div class="sub">Click any organism to open its identification detail. The bacteria key follows the Oxford Handbook of ID &amp; Microbiology (Figs 7.1&ndash;7.4).</div>
</header>
<div class="kings" id="kings"></div>
<div class="wrap">
  <div class="tree" id="tree"></div>
  <div class="side" id="side"><div class="empty">Select an organism from the chart.<br>Its identification, microscopy and mechanism detail appears here.</div></div>
</div>

<script src="../data/enums.js"></script>
<script src="../data/organisms.js"></script>
<script src="../data/taxonomy.js"></script>
<script src="../data/image-credits.js"></script>
<script>
const ORG = new Map(ORGANISMS.map(o=>[o.id,o]));
const COUNTS={}; ORGANISMS.forEach(o=>COUNTS[o.kingdom]=(COUNTS[o.kingdom]||0)+1);
const KCOL={bacteria:'var(--extra)',virus:'var(--cyto)',fungus:'var(--vesic)',parasite:'var(--surf)'};
const NICHECOL={extra:'var(--extra)',vesic:'var(--vesic)',cyto:'var(--cyto)',surf:'var(--surf)'};
const TAGS=new Map((ENUMS.transmissionTags||[]).map(t=>[t.id,t]));
function routeTags(o){ if(!o.routes||!o.routes.length) return '';
  return `<div class="routes">${o.routes.map(r=>{const t=TAGS.get(r);return t?`<span class="rtag" title="${t.kind}">${t.label}</span>`:''}).join('')}</div>`; }
const kh=document.getElementById('kings'), treeEl=document.getElementById('tree'),
      srcEl=null, side=document.getElementById('side');
let cur='bacteria', selEl=null;

/* ---- microscopy schematic: Gram + morphology → shapes in a field of view ----
   This is a SCHEMATIC drawn from the organism's taxonomy. To show a real light
   micrograph instead, set the organism's `micrograph` field (image URL / data-URI);
   the panel below prefers it over this schematic. */
function seeded(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}
  return ()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};}
function schematic(o){
  const t=o.taxonomy||{};
  const gram=t.gram||'';
  // stain colour by Gram reaction / acid-fast / variable
  let stain=null, field='#efe9f4';
  if(gram==='positive'){stain='#7d40b3';field='#efe9f4';}          // crystal violet
  else if(gram==='negative'){stain='#d24d6b';field='#f6ebee';}     // safranin
  else if(gram.includes('acid-fast')){stain='#c0392b';field='#e6eef3';} // ZN red on methylene-blue field
  else if(gram==='variable'){stain='#9b59b6';field='#efeaf3';}     // Gram-variable
  if(!stain) return null;
  const m=(t.morphology||'').toLowerCase();
  const rnd=seeded(o.id);
  const cx=110, cy=80, R=66;
  const inField=(x,y,pad)=>Math.hypot(x-cx,y-cy) < R-(pad||8);
  let body='';
  const circle=(x,y,r)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${stain}"/>`;
  const rod=(x,y,w,h,rx,rot)=>`<rect x="${(x-w/2).toFixed(1)}" y="${(y-h/2).toFixed(1)}" width="${w}" height="${h}" rx="${rx}" fill="${stain}" transform="rotate(${rot.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  function place(n,draw,pad){let done=0,guard=0;while(done<n&&guard<n*40){guard++;
    const a=rnd()*Math.PI*2, rr=Math.sqrt(rnd())*(R-16);
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
    if(inField(x,y,pad)){draw(x,y);done++;}}}
  if(m.includes('cluster')){                     // grape-like cocci clusters
    for(let c=0;c<3;c++){const a=rnd()*6.28, rr=Math.sqrt(rnd())*(R-24);
      const gx=cx+Math.cos(a)*rr, gy=cy+Math.sin(a)*rr;
      for(let i=0;i<6;i++){const ox=gx+(rnd()-.5)*22, oy=gy+(rnd()-.5)*22;
        if(inField(ox,oy,6))body+=circle(ox,oy,5.4);}}
  }else if(m.includes('diploc')){                 // pairs
    place(4,(x,y)=>{body+=circle(x-4,y,5.2)+circle(x+4,y,5.2);},14);
  }else if(m.includes('chain')){                  // cocci in chains
    for(let c=0;c<3;c++){const y=cy+(c-1)*26+(rnd()-.5)*8; let x=cx-46+(rnd()-.5)*10;
      for(let i=0;i<9;i++){const yy=y+Math.sin(i*.7)*4; if(inField(x,yy,5))body+=circle(x,yy,5); x+=10.5;}}
  }else if(m.includes('boxcar')||m.includes('box car')){  // square-ended rods in chains
    for(let c=0;c<3;c++){const y=cy+(c-1)*24+(rnd()-.5)*8; let x=cx-40;
      for(let i=0;i<4;i++){if(inField(x,y,10))body+=rod(x,y,16,10,1.5,(rnd()-.5)*6); x+=18;}}
  }else if(m.includes('curved')||m.includes('comma')||m.includes('vibrio')){ // comma
    place(7,(x,y)=>{const rot=rnd()*360;body+=`<path d="M${x-8},${y+5} Q ${x},${y-9} ${x+8},${y+3}" stroke="${stain}" stroke-width="5" fill="none" stroke-linecap="round" transform="rotate(${rot.toFixed(0)} ${x} ${y})"/>`;},12);
  }else if(m.includes('rod')||m.includes('bacill')||m.includes('boxcar')){   // bacilli
    place(9,(x,y)=>{body+=rod(x,y,20,8,4,rnd()*180);},12);
  }else if(m.includes('cocc')){                   // scattered cocci
    place(14,(x,y)=>{body+=circle(x,y,5.2);},8);
  }else{                                           // generic
    place(10,(x,y)=>{body+=rod(x,y,16,7,3.5,rnd()*180);},10);
  }
  return `<svg viewBox="0 0 220 160" width="100%" style="max-width:300px;display:block;margin:auto">
    <defs><clipPath id="fov"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath></defs>
    <rect x="0" y="0" width="220" height="160" fill="#0e1014"/>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="${field}"/>
    <g clip-path="url(#fov)">${body}</g>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="6"/>
    <circle cx="${cx}" cy="${cy}" r="${R+3}" fill="none" stroke="#2b303b" stroke-width="1.5"/>
  </svg>`;
}

/* ---- top-down chart ----
   The key is drawn as a top-down chart: decision nodes (label + the test that
   splits them) at the top, branching down to the organisms. Organisms that sit
   side by side under one node are grouped in a dashed box, stacked vertically,
   so the chart stays narrow. When the kingdom's branches don't fit across the
   screen they wrap into rows, joined to the kingdom by a trunk on the left.
   Positions are computed here; connectors are drawn in an SVG layer behind. */
const BW_MAX=184, BW_MIN=150; let NW=184, SW=184; const HG=14, TG=34, VG=30, TRUNK=14, GUT=34;
let chartEl=null, svgEl=null, scrollEl=null, hintEl=null, ROOTU=null, activeId=null, ro=null, raf=0;

function txt(tag, cls, s){ const e=document.createElement(tag); if(cls) e.className=cls; e.textContent=s; return e; }

function makeLeaf(node, path){
  const o=ORG.get(node.organism);
  const b=document.createElement('button'); b.type='button'; b.className='leaf'; b.dataset.id=node.organism;
  b.appendChild(txt('b','',o?o.name:node.organism));
  if(node.label) b.appendChild(txt('span','ll',node.label));
  if(node.organism===activeId) b.classList.add('active');
  b.onclick=()=>{
    document.querySelectorAll('.leaf').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); selEl=b; activeId=node.organism;
    showDetail(o||{id:node.organism,name:node.organism}, path.concat(node.label?[{label:node.label}]:[]));
  };
  return b;
}
function makeUnit(node, path, depth){
  const u={kind:'node', node, depth, kids:[]};
  const el=document.createElement('div'); el.className='tbox tnode'+(depth===0?' troot':'');
  if(node.label) el.appendChild(txt('div','tl',node.label));
  if(node.note) el.appendChild(txt('div','tn','('+node.note+')'));
  if(node.test) el.appendChild(txt('div','tt',node.test));
  chartEl.appendChild(el); u.el=el;
  const nextPath=path.concat(node.label?[{label:node.label,test:node.test}]:[]);
  let stack=null;
  (node.children||[]).forEach(c=>{
    if(c.organism){
      if(!stack){ stack={kind:'stack', depth:depth+1, el:document.createElement('div')};
        stack.el.className='tbox tstack'; chartEl.appendChild(stack.el); u.kids.push(stack); }
      stack.el.appendChild(makeLeaf(c,nextPath));
    } else { stack=null; u.kids.push(makeUnit(c,nextPath,depth+1)); }
  });
  return u;
}

function widths(u){
  if(u.kind==='stack'){ u.w=SW; return u.w; }
  const span=u.kids.reduce((a,k)=>a+widths(k),0)+HG*Math.max(0,u.kids.length-1);
  return u.w=Math.max(NW,span);
}
function heights(u){ u.h=u.el.offsetHeight; if(u.kind==='node') u.kids.forEach(heights); }
/* widest box size (BW_MAX → BW_MIN) at which every row fits the screen */
function fitBox(R, avail){
  for(let bw=BW_MAX; bw>=BW_MIN; bw-=2){
    NW=SW=bw; R.kids.forEach(widths);
    const total=R.kids.reduce((a,k)=>a+k.w,0)+TG*Math.max(0,R.kids.length-1);
    if(total<=avail||Math.max(...R.kids.map(k=>k.w))+GUT<=avail) return;
  }
}
function collect(u, levels){                 // tallest decision node per depth
  if(u.kind!=='node') return;
  levels[u.depth]=Math.max(levels[u.depth]||0,u.h);
  u.kids.forEach(k=>collect(k,levels));
}
function place(u, x0, Y){
  u.y=Y[u.depth];
  if(u.kind==='stack'){ u.x=x0; u.ax=x0+SW/2; return; }
  if(!u.kids.length){ u.x=x0+(u.w-NW)/2; u.ax=u.x+NW/2; return; }
  const span=u.kids.reduce((a,k)=>a+k.w,0)+HG*(u.kids.length-1);
  let x=x0+(u.w-span)/2;
  u.kids.forEach(k=>{ place(k,x,Y); x+=k.w+HG; });
  const mid=(u.kids[0].ax+u.kids[u.kids.length-1].ax)/2;
  u.ax=Math.min(Math.max(mid,x0+NW/2),x0+u.w-NW/2);
  u.x=u.ax-NW/2;
}
function edges(u, out){                       // parent → bus → children
  if(u.kind!=='node'||!u.kids.length) return;
  const bot=u.y+u.h, bus=bot+VG/2, xs=u.kids.map(k=>k.ax);
  out.push(`M${u.ax},${bot}V${bus}`);
  const lo=Math.min(u.ax,...xs), hi=Math.max(u.ax,...xs);
  if(hi>lo) out.push(`M${lo},${bus}H${hi}`);
  u.kids.forEach(k=>out.push(`M${k.ax},${bus}V${k.y}`));
  u.kids.forEach(k=>edges(k,out));
}
function setPos(u){
  u.el.style.left=u.x+'px'; u.el.style.top=u.y+'px';
  if(u.kind==='node') u.kids.forEach(setPos);
}
function bottom(u){ return u.kind==='node'?Math.max(u.y+u.h,...u.kids.map(bottom)):u.y+u.h; }

function layout(){
  raf=0; const R=ROOTU; if(!R||!chartEl.isConnected) return;
  const branches=R.kids, avail=Math.max(320,scrollEl.clientWidth-4);
  fitBox(R,avail); chartEl.style.setProperty('--bw',NW+'px'); heights(R); widths(R);
  const total=branches.reduce((a,k)=>a+k.w,0)+TG*Math.max(0,branches.length-1);
  const paths=[]; let W=0, H=0;
  // pack the kingdom's branches into rows
  const rows=[];
  if(total<=avail) rows.push(branches);
  else { let row=[], w=0; branches.forEach(k=>{
      const need=(row.length?TG:0)+k.w;
      if(row.length&&GUT+w+need>avail){ rows.push(row); row=[]; w=0; }
      w+=(row.length?TG:0)+k.w; row.push(k); });
    if(row.length) rows.push(row); }
  const multi=rows.length>1;
  let top=R.h+VG;
  rows.forEach(row=>{
    const lv={}; row.forEach(k=>collect(k,lv));
    const Y={}, maxD=Math.max(1,...Object.keys(lv).map(Number)); let y=top;
    for(let d=1; d<=maxD+1; d++){ Y[d]=y; y+=(lv[d]||0)+VG; }
    let x=multi?GUT:0;
    row.forEach(k=>{ place(k,x,Y); x+=k.w+TG; });
    row.forEach(k=>edges(k,paths));
    W=Math.max(W,x-TG);
    const b=Math.max(...row.map(bottom));
    row.bus=top-VG/2; top=b+VG*1.6;
    H=Math.max(H,b);
  });
  // the kingdom (root) node and its connectors
  R.y=0;
  if(!multi){
    const xs=branches.map(k=>k.ax), mid=(xs[0]+xs[xs.length-1])/2;
    R.ax=Math.min(Math.max(mid,NW/2),Math.max(W,NW)-NW/2); R.x=R.ax-NW/2;
    const bus=R.h+VG/2; paths.push(`M${R.ax},${R.h}V${bus}`);
    paths.push(`M${Math.min(R.ax,...xs)},${bus}H${Math.max(R.ax,...xs)}`);
    branches.forEach(k=>paths.push(`M${k.ax},${bus}V${k.y}`));
  } else {
    R.x=0; R.ax=NW/2;
    paths.push(`M${TRUNK},${R.h}V${rows[rows.length-1].bus}`);
    rows.forEach(row=>{
      paths.push(`M${TRUNK},${row.bus}H${row[row.length-1].ax}`);
      row.forEach(k=>paths.push(`M${k.ax},${row.bus}V${k.y}`));
    });
  }
  R.el.style.left=R.x+'px'; R.el.style.top='0px';
  branches.forEach(setPos);
  W=Math.max(W,R.x+NW)+2; H+=2;
  chartEl.style.width=W+'px'; chartEl.style.height=H+'px';
  svgEl.setAttribute('width',W); svgEl.setAttribute('height',H); svgEl.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svgEl.innerHTML=`<path d="${paths.join('')}"/>`;
  const over=W>scrollEl.clientWidth+2;
  scrollEl.classList.toggle('pannable',over); hintEl.classList.toggle('on',over);
}
function schedule(){ if(!raf) raf=requestAnimationFrame(layout); }

function draw(){
  treeEl.innerHTML=''; ROOTU=null; if(ro) ro.disconnect();
  const entry=TAXONOMY[cur];
  if(!entry||entry.pending){
    treeEl.innerHTML='<div class="pending"><b>'+cur[0].toUpperCase()+cur.slice(1)+
      ' tree not yet authored.</b><br>Seam in <code>data/taxonomy.js</code>. '+(COUNTS[cur]||0)+' '+cur+
      ' carry a kingdom tag and will be keyed the same way the bacteria tree was.</div>';
    return;
  }
  if(entry.source){const s=document.createElement('div');s.className='src';s.textContent='Source: '+entry.source;treeEl.appendChild(s);}
  hintEl=txt('div','chart-hint','Scroll sideways (or drag) to see the whole chart.'); treeEl.appendChild(hintEl);
  scrollEl=document.createElement('div'); scrollEl.className='chart-scroll';
  chartEl=document.createElement('div'); chartEl.className='chart'; chartEl.style.setProperty('--k',KCOL[cur]||'var(--surf)');
  chartEl.setAttribute('role','tree'); chartEl.setAttribute('aria-label',cur+' identification key');
  svgEl=document.createElementNS('http://www.w3.org/2000/svg','svg'); svgEl.setAttribute('class','edges'); svgEl.setAttribute('aria-hidden','true');
  chartEl.appendChild(svgEl); scrollEl.appendChild(chartEl); treeEl.appendChild(scrollEl);
  ROOTU=makeUnit(entry.tree,[],0);
  if(window.ResizeObserver){ ro=new ResizeObserver(schedule); chartEl.querySelectorAll('.tbox').forEach(e=>ro.observe(e)); ro.observe(scrollEl); }
  layout();
  enablePan(scrollEl);
}
/* drag the background to pan a chart wider than the screen */
function enablePan(sc){
  let sx=0, sl=0, on=false;
  sc.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse'||e.target.closest('.leaf')||!sc.classList.contains('pannable')) return;
    on=true; sx=e.clientX; sl=sc.scrollLeft; sc.classList.add('panning'); });
  window.addEventListener('pointermove',e=>{ if(on) sc.scrollLeft=sl-(e.clientX-sx); });
  window.addEventListener('pointerup',()=>{ if(on){ on=false; sc.classList.remove('panning'); } });
}
window.addEventListener('resize',schedule);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(schedule);

/* ---- detail panel ---- */
function showDetail(o, path){
  const t=o.taxonomy||{};
  const hasTax=Object.keys(t).length>0;
  const crumb=path.filter(p=>p.label).map(p=>p.label).join(' › ');
  // microscopy: show the schematic now; a real image (if present) swaps in after render
  const svg=schematic(o);
  const micro = svg
    ? `${svg}<div class="microcap">Schematic from Gram stain + morphology — <b>not a real micrograph</b>. Drop a real image named <code>${o.id}.jpg</code> into the <code>images/</code> folder and it replaces this automatically.</div>`
    : `<div style="height:120px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px">Light microscopy</div>
       <div class="microcap">No schematic for this one — a real image named <code>${o.id}.jpg</code> in the <code>images/</code> folder appears here.</div>`;
  const taxRows = hasTax ? Object.entries(t).filter(([k,v])=>v!==null&&v!==undefined&&k!=='note')
      .map(([k,v])=>`<dt>${k}</dt><dd>${v===true?'yes':v===false?'no':v}</dd>`).join('') : '';
  const kcol=KCOL[o.kingdom]||'var(--surf)';
  side.innerHTML=`<div class="card" style="--k:${kcol}">
    <h2>${o.name}</h2>
    <div class="kick">${o.kingdom||''}${crumb?' · identification':''}</div>
    ${o.niche?`<div class="badges">${(o.tier?`<span class="n" style="background:${kcol}">กลุ่ม ${o.tier}</span>`:'')}
      ${(o.niche||[]).map(n=>`<span style="border-left:3px solid ${NICHECOL[n]||'var(--line)'}">${n}</span>`).join('')}
      ${(o.sys||[]).map(s=>`<span>${s}</span>`).join('')}</div>`:''}
    ${crumb?`<div class="scope">Key: <b>${crumb}</b></div>`:''}
    <div class="micro">${micro}</div>
    ${o.look?`<div class="lookhint"><span class="em">🔬</span><div><span class="lbl">Down the scope</span><b>${o.look}</b></div></div>`:''}
    ${hasTax?`<div class="blk"><div class="lab">Identification</div><dl class="tax">${taxRows}</dl>
      ${t.note?`<p style="margin-top:8px;color:var(--dim);font-size:12px">${t.note}</p>`:''}</div>`:
      `<div class="blk"><div class="lab">Identification</div><div class="awaiting">Not yet authored.</div></div>`}
    ${o.treatment&&o.treatment.length?`<div class="blk"><div class="lab">Treatment — mechanism</div>
      <ul class="rx">${o.treatment.map(x=>`<li><b>${x.class}</b> — <span>${x.mechanism}</span></li>`).join('')}</ul></div>`:''}
    ${o.resistance&&o.resistance.length?`<div class="blk"><div class="lab">Resistance — mechanism</div>
      <ul class="rx">${o.resistance.map(x=>`<li><b>${x.mechanism}</b> — <span>${x.detail}</span></li>`).join('')}</ul></div>`:''}
    ${o.transmission?`<div class="blk"><div class="lab">Transmission — how it reaches humans</div>${routeTags(o)}<p>${o.transmission}</p></div>`:''}
    ${o.lifecycle?`<div class="blk"><div class="lab">Life cycle</div><div class="lcimg"></div><p>${o.lifecycle}</p></div>`:''}
    ${o.panels?`<div class="blk"><div class="lab">Resulting disease</div><p>${o.panels.dis}</p></div>`:''}
  </div>`;
  side.scrollTop=0;
  mountMicrograph(o);
  mountLifecycle(o);
}

/* In the single-file bundle, images are inlined as base64 in window.__IMG__
   (on this frame or its parent shell). Look there first; else probe images/. */
function embeddedImg(key){ try{ return (window.__IMG__||(window.parent&&window.parent.__IMG__)||{})[key]||null; }catch(e){ return null; } }
/* Drop a life-cycle diagram in as images/<id>-lifecycle.(jpg|jpeg|png|gif) and it
   appears inside the Life cycle block. Falls back silently to the text. */
function mountLifecycle(o){
  const slot=side.querySelector('.lcimg'); if(!slot) return;
  const key=o.id+'-lifecycle', paint=(src)=>{ slot.innerHTML=`<img class="lcpic" src="${src}" alt="Life cycle of ${o.name}"><div class="microcap">Life-cycle diagram.</div>`; };
  const emb=embeddedImg(key); if(emb){ paint(emb); return; }
  const paths=['jpg','jpeg','png','gif'].map(e=>`../images/${key}.${e}`);
  let i=0;
  (function tryNext(){
    if(i>=paths.length) return;
    const src=paths[i++], img=new Image();
    img.onload=()=>paint(src);
    img.onerror=tryNext;
    img.src=src;
  })();
}

/* Attribution caption for a fetched image. Wikimedia Commons images are freely
   licensed but most require credit (CC BY / CC BY-SA); show author + license +
   source. Falls back to a plain label when the image carries no credit entry. */
function micrographCredit(o){
  const c=(typeof IMAGE_CREDITS!=='undefined'&&IMAGE_CREDITS)?IMAGE_CREDITS[o.id]:null;
  if(!c) return 'Light micrograph.';
  const art=(c.artist&&c.artist!=='Unknown')?c.artist:'Unknown author';
  return `© ${art} · ${c.license} · <a href="${c.source}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Wikimedia Commons</a>`;
}

/* Swap the schematic for a real light micrograph if one exists.
   Priority: an explicit `micrograph` field, else images/<id>.(jpg|jpeg|png).
   Falls back silently to the schematic when no image is found. */
function mountMicrograph(o){
  const slot=side.querySelector('.micro'); if(!slot) return;
  const paint=(src)=>{ slot.innerHTML=
      `<img src="${src}" alt="Micrograph of ${o.name}" style="width:100%;max-width:320px;border-radius:8px;display:block;margin:auto">
       <div class="microcap">${micrographCredit(o)}</div>`; };
  if(!o.micrograph){ const emb=embeddedImg(o.id); if(emb){ paint(emb); return; } }
  const paths = o.micrograph ? [o.micrograph]
    : ['jpg','jpeg','png'].map(e=>`../images/${o.id}.${e}`);
  let i=0;
  (function tryNext(){
    if(i>=paths.length) return;           // keep the schematic fallback
    const src=paths[i++], img=new Image();
    img.onload=()=>paint(src);
    img.onerror=tryNext;
    img.src=src;
  })();
}

/* ---- kingdom switcher ---- */
ENUMS.kingdoms.forEach(k=>{
  const c=document.createElement('div');
  c.className='king'+(TAXONOMY[k]&&TAXONOMY[k].pending?' seam':'')+(k===cur?' on':'');
  c.style.setProperty('--c',KCOL[k]||'var(--dim)');
  c.innerHTML=k[0].toUpperCase()+k.slice(1)+'<small>'+(COUNTS[k]||0)+'</small>';
  c.onclick=()=>{cur=k;activeId=null;document.querySelectorAll('.king').forEach(x=>x.classList.remove('on'));c.classList.add('on');
    side.innerHTML='<div class="empty">Select an organism from the chart.</div>';draw();};
  kh.appendChild(c);
});
draw();
</script>
<!-- selection detail as a centered popup (POPUP-MODAL) -->
<style>
.wrap{grid-template-columns:minmax(0,1fr) !important}
#pop-backdrop{position:fixed;inset:0;background:rgba(6,8,12,.66);opacity:0;pointer-events:none;
  transition:opacity .16s ease;z-index:90}
body.pop-open #pop-backdrop{opacity:1;pointer-events:auto}
.side{position:fixed !important;top:50% !important;left:50% !important;bottom:auto !important;
  transform:translate(-50%,-47%) scale(.985);
  width:min(600px,calc(100vw - 24px)) !important;max-width:calc(100vw - 24px) !important;
  max-height:min(88vh,760px) !important;height:auto !important;
  border:1px solid var(--line) !important;border-radius:16px !important;
  box-shadow:0 28px 80px rgba(0,0,0,.6);opacity:0;pointer-events:none;z-index:91;
  transition:opacity .18s ease,transform .18s ease;overscroll-behavior:contain}
body.pop-open .side{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#pop-close{position:fixed;top:16px;right:18px;z-index:92;width:34px;height:34px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel2,#1c212a);color:var(--ink,#e8eaee);
  font:600 18px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;display:none}
body.pop-open #pop-close{display:block}
@media (prefers-reduced-motion:reduce){#pop-backdrop,.side{transition:none}}
</style>
<script>
(function(){
  var side=document.getElementById('side'); if(!side) return;
  var empty=side.innerHTML;
  var bd=document.createElement('div'); bd.id='pop-backdrop';
  var cl=document.createElement('button'); cl.id='pop-close'; cl.type='button'; cl.setAttribute('aria-label','Close'); cl.innerHTML='×';
  document.body.appendChild(bd); document.body.appendChild(cl);
  function isOpen(){ return !!side.querySelector('.card'); }
  function sync(){ document.body.classList.toggle('pop-open', isOpen()); }
  new MutationObserver(sync).observe(side,{childList:true});
  function close(){ side.innerHTML=empty; document.body.classList.remove('pop-open');
    document.querySelectorAll('.org.active,.leaf.active,.chip.on,.lz.on').forEach(function(e){e.classList.remove('active');e.classList.remove('on');}); }
  bd.addEventListener('click',close); cl.addEventListener('click',close);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&document.body.classList.contains('pop-open')) close(); });
  sync();
})();
</script>
</body>
